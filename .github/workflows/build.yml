name: Build RestrictEvents JSC (b70aaa4)
on:
  workflow_dispatch: # 手动触发按钮

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout RestrictEvents javascriptcore branch
        run: |
          git clone --depth=1 -b javascriptcore https://github.com/acidanthera/RestrictEvents.git
          cd RestrictEvents
          git reset --hard b70aaa4
          git submodule update --init --recursive

      - name: Build Release
        run: |
          cd RestrictEvents
          xcodebuild -scheme RestrictEvents -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: RestrictEvents-JSC-b70aaa4
          path: RestrictEvents/build/Release/RestrictEvents.kext
